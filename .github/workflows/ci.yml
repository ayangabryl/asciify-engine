name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Headless entry runs in Node without a DOM
        run: npm run test:headless

  browser:
    name: Visual baselines and browser checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The baselines were drawn with this Chromium (the pinned Playwright's) and DejaVu fonts, in SwiftShader: no GPU needed.
      - name: Install Chromium and fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Build package
        run: npm run build

      - name: Visual baselines
        run: npm run test:visual

      - name: Field effects and live sources
        run: npm run test:effects

      - name: Element sources (with and without HTML-in-Canvas)
        run: npm run test:element

      - name: GPU text export (every mode against the CPU path)
        run: npm run test:gpu-text

      - name: Upload differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: tests/visual/baselines/*.actual.png
          if-no-files-found: ignore
